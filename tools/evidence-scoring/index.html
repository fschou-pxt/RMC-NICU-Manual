<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Check Scoring</title>
<style>
  :root { --line: #d9dee5; --ink: #1c2733; --muted: #5d6b7a; --brand: #0b6cb8; --panel: #f6f8fa; --pick: #0b6cb8; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #fff !important; color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Inter, sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header b.title { font-size: 15px; }
  .who { color: var(--muted); font-size: 13px; }
  .who a { color: var(--brand); }
  .prog { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .bar { width: 140px; height: 8px; border-radius: 4px; background: #e2e7ed; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); width: 0; }
  #jump { max-width: 340px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 13px; }
  .btn { padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 13px; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); min-height: 0; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-right: 1px solid var(--line); }
  .itemwrap { padding: 10px 14px; border-bottom: 1px solid var(--line); max-height: 44vh; overflow: auto; }
  .crumb { font-size: 13px; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dots { display: inline-flex; gap: 3px; flex-wrap: wrap; }
  .dots button { width: 22px; height: 20px; padding: 0; font-size: 11px; line-height: 18px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--muted); }
  .dots button.done { background: #d8ecdf; border-color: #9cc9ad; color: #1d5a35; }
  .dots button.on { outline: 2px solid var(--brand); outline-offset: 0; }
  section.evidence { margin: 0 !important; }
  section.evidence .ev-full { margin: 6px 0 0; font-size: 14px; line-height: 1.5; }
  section.evidence sup a { cursor: pointer; }
  section.evidence sup a.opened { background: var(--brand); color: #fff; border-radius: 3px; padding: 0 2px; }
  .stale { margin: 6px 0 0; padding: 4px 8px; border-radius: 6px; background: #fdecea; color: #8c1d18; font-size: 13px; }
  .manual { overflow: auto; padding: 8px 18px 40px; }
  .manual .tag { position: sticky; top: -8px; z-index: 2; margin: -8px -18px 8px; padding: 5px 18px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .manual .tag a { color: var(--brand); }
  .ctx { opacity: .55; }
  .ctx-label { margin: 18px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
  .manual mark { background: #ffe58a; color: inherit; box-shadow: 0 0 0 2px #ffe58a; border-radius: 2px; }
  .sl-anchor-link { display: none !important; }
  .manual img, .manual video { max-width: 100%; height: auto; }
  aside { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; background: var(--panel); }
  .refs { padding: 8px 12px; border-bottom: 1px solid var(--line); max-height: 28vh; overflow: auto; font-size: 13px; }
  .refs h3, .score h3 { margin: 0 0 4px; font-size: 13px; }
  .refs details summary { color: var(--muted); cursor: pointer; margin-top: 4px; }
  .ref { display: grid; grid-template-columns: 24px 1fr; gap: 0 4px; padding: 4px 0; border-top: 1px solid #e6eaef; }
  .ref.on { background: #e6f1fa; }
  .ref .n { font-weight: 600; color: var(--muted); text-align: right; padding-right: 4px; }
  .ref .t { line-height: 1.35; }
  .ref .acts { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 1px; }
  .ref .acts a { color: var(--brand); cursor: pointer; text-decoration: none; font-size: 12.5px; }
  .ref .acts a:hover { text-decoration: underline; }
  .viewer { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: #fff; }
  .vbar { display: flex; gap: 8px; align-items: center; padding: 3px 12px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .vbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .vbar a { color: var(--brand); white-space: nowrap; }
  iframe { border: 0; width: 100%; height: 100%; background: #fff; color-scheme: light; }
  .vmsg { padding: 24px; color: var(--muted); font-size: 14px; }
  .score { padding: 8px 12px 10px; border-top: 1px solid var(--line); }
  .score p { margin: 0 0 6px; font-size: 13px; }
  .likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .likert button { padding: 6px 2px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 12.5px; line-height: 1.2; }
  .likert button kbd { display: block; font: 11px monospace; color: var(--muted); }
  .likert button:hover { border-color: var(--pick); }
  .likert button.on { background: var(--pick); border-color: var(--pick); color: #fff; }
  .likert button.on kbd { color: #d6e8f7; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 40px; font-size: 13px; background: #fff; }
  .nav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .saved { flex: 1; font-size: 12.5px; color: var(--muted); }
  #gate { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #eef2f6; }
  #gate form { width: min(420px, calc(100vw - 32px)); padding: 22px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  #gate h1 { margin: 0 0 6px; font-size: 19px; }
  #gate p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  #gate input { width: 100%; box-sizing: border-box; padding: 7px 9px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<div id="gate"><form>
  <h1>Evidence check scoring</h1>
  <p>Enter your name. Your scores are kept in your own file and you will only see your own. Use the same spelling each time to resume.</p>
  <input id="name" autocomplete="off" placeholder="Reviewer name" required>
  <button class="btn primary">Start</button>
</form></div>
<div id="app" hidden>
  <header>
    <b class="title">Evidence check scoring</b>
    <span class="who"><span id="who"></span> · <a href="#" id="switch">switch</a></span>
    <span class="prog"><span class="bar"><i id="bar"></i></span><span id="count"></span></span>
    <select id="jump" aria-label="Jump to section"></select>
    <span class="spacer"></span>
    <button class="btn" id="nextOpen">Next unscored</button>
    <a class="btn" id="export">Export my CSV</a>
  </header>
  <main>
    <div class="left">
      <div class="itemwrap"><p class="crumb"><span id="crumb"></span><span class="dots" id="dots"></span></p><div id="item" class="sl-markdown-content"></div></div>
      <div class="manual" id="manual"></div>
    </div>
    <aside>
      <div class="refs" id="refs"></div>
      <div class="viewer"><div class="vbar"><span id="vtitle">Pick a reference above</span><a id="vopen" target="_blank" rel="noopener" hidden>Open in new tab ↗</a></div><div id="vbody" style="min-height:0"></div></div>
      <div class="score">
        <p id="question"></p>
        <div class="likert" id="likert"></div>
        <textarea id="comment" placeholder="Comment (optional)"></textarea>
        <div class="nav"><button class="btn" id="prev">← Previous</button><span class="saved" id="saved"></span><button class="btn primary" id="next">Next →</button></div>
      </div>
    </aside>
  </main>
</div>
<script>
// The rating statement. Set by the study team; change it before scoring starts, not during.
const question = (item) => item.kind === "related"
  ? "This related point is accurate and applies to what this manual section covers."
  : `The AI's ruling, "${item.label}", is right for this statement, given the cited evidence and what this manual section covers (for example, the patient population).`;

const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
let data, sections, reviewer, scores = {}, at = 0, typed = false, commentTimer;
const pages = new Map();
const framed = new Map();

// the built manual page: its content nodes (evidence boxes marked, not shown) and stylesheets
async function page(slug) {
  if (pages.has(slug)) return pages.get(slug);
  const p = fetch(`/${slug}.html`).then((r) => (r.ok ? r.text() : Promise.reject())).then((html) => {
    const doc = new DOMParser().parseFromString(html, "text/html");
    for (const l of doc.querySelectorAll('link[rel="stylesheet"][href^="/_astro/"]:not([media="print"])')) {
      if (!document.querySelector(`link[href="${l.getAttribute("href")}"]`)) document.head.prepend(Object.assign(document.createElement("link"), { rel: "stylesheet", href: l.getAttribute("href") }));
    }
    const root = doc.querySelector(".sl-markdown-content");
    root.querySelectorAll("script, style, .sl-anchor-link, footer").forEach((n) => n.remove());
    root.querySelectorAll("*").forEach((n) => { for (const a of [...n.attributes]) if (a.name.startsWith("on")) n.removeAttribute(a.name); });
    root.querySelectorAll("video").forEach((v) => v.setAttribute("preload", "none"));
    return [...root.children];
  }).catch(() => null);
  pages.set(slug, p);
  return p;
}

const headingOf = (n) => n.matches?.(".sl-heading-wrapper") ? n.querySelector("h1,h2,h3,h4,h5,h6") : n.matches?.("h1,h2,h3,h4,h5,h6") ? n : null;
const depthOf = (n) => Number(headingOf(n).tagName[1]);
// letters and digits only, so markup and punctuation in the stored statement don't matter
const norm = (s) => s.toLowerCase().replace(/\]\([^)]*\)/g, " ").replace(/&ge;/g, "≥").replace(/&le;/g, "≤").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&[a-z]+;/g, " ").replace(/[^\p{L}\p{N}≥≤<>]/gu, "");
// the stored statement is often several lines joined up, so also try its parts
const fragments = (t) => {
  const clean = t.replace(/<\/?su[bp]>/g, "").replace(/^\s*(\d+\.|-)\s+/, "");
  const parts = clean.split(/\s*\*\s+|\s*\|\s*|\n+|;\s+|:\s+|\s+-+>?\s+|\s*→\s*|\.\s+(?:\d+\.\s+)?/).map(norm).filter((x) => x.length >= 8);
  return [norm(clean), ...parts];
};

function textMap(root) {
  const nodes = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let text = "";
  while (w.nextNode()) {
    const n = w.currentNode;
    for (let i = 0; i < n.data.length; i++) { const c = norm(n.data[i]); if (c) { nodes.push([n, i]); text += c; } }
  }
  return { nodes, text };
}
function wrapRange(map, from, to) {
  const byNode = new Map();
  for (let i = from; i < to; i++) { const [n, o] = map.nodes[i]; const r = byNode.get(n) || [o, o]; r[1] = o; byNode.set(n, r); }
  for (const [n, [a, b]] of byNode) {
    const r = document.createRange(); r.setStart(n, a); r.setEnd(n, b + 1);
    const m = document.createElement("mark"); r.surroundContents(m);
  }
}
function highlight(root, target) {
  if (!target) return false;
  const all = fragments(target);
  let map = textMap(root), hit = map.text.indexOf(all[0]);
  if (hit >= 0) { wrapRange(map, hit, hit + all[0].length); return true; }
  let any = false;
  for (const f of all.slice(1)) {
    map = textMap(root); hit = map.text.indexOf(f);
    if (hit >= 0) { wrapRange(map, hit, hit + f.length); any = true; }
  }
  return any;
}

// the text the box covers: from its heading (or an earlier statement, for split sections) up to the box, plus neighbours
function sectionRange(nodes, sec) {
  const boxes = nodes.flatMap((n, i) => (n.matches(".evidence") ? [i] : []));
  const box = boxes.find((i) => nodes[i].querySelector(`[id^="ev-${sec.id}-"]`) || nodes[i].querySelector(`[data-total="${sec.id}"]`));
  const head = nodes.findIndex((n) => headingOf(n)?.id === sec.hash);
  const end = box ?? nodes.findIndex((n, i) => i > head && headingOf(n) && depthOf(n) <= depthOf(nodes[head]));
  const stop = end < 0 ? nodes.length : end;
  let start = head < 0 ? 0 : head;
  const prior = boxes.filter((i) => i < stop).pop();
  if (prior !== undefined && prior >= start) start = prior + 1;
  const wanted = sec.targets.flatMap((t) => fragments(t).slice(0, 2));
  for (let i = 0; i < start; i++) {
    if (prior !== undefined && i <= prior) continue;
    const t = norm(nodes[i].textContent);
    if (wanted.some((w) => w.length > 15 && t.includes(w))) { start = i; while (start > 0 && !headingOf(nodes[start])) start--; break; }
  }
  const back = (from) => { let i = from - 1; while (i > 0 && !headingOf(nodes[i])) i--; return Math.max(i, 0); };
  const fwd = (from) => { let i = from + 1; while (i < nodes.length && !headingOf(nodes[i])) i++; return Math.min(i, nodes.length); };
  return { start, stop, before: back(start), after: fwd(stop) };
}

// flowcharts: drawn from the Mermaid source as on the site (PageTitle.astro); without the network the source text stays
let mermaidLib;
async function drawDiagrams(root) {
  const blocks = root.querySelectorAll("pre.mermaid:not([data-processed])");
  if (!blocks.length) return;
  try {
    if (!mermaidLib) {
      mermaidLib = (await import("https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs")).default;
      mermaidLib.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: { fontFamily: "Inter, system-ui, sans-serif", fontSize: "14px", primaryColor: "#eef4fa", primaryBorderColor: "#9fbfdc", lineColor: "#0068a8" }, flowchart: { wrappingWidth: 400, nodeSpacing: 36, rankSpacing: 36, padding: 10, useMaxWidth: true } });
    }
    await mermaidLib.run({ nodes: blocks });
  } catch (e) { console.warn("diagram not drawn", e); }
}

async function renderManual(sec, item, token) {
  const box = $("manual");
  const nodes = await page(sec.page);
  if (token !== at) return;
  if (!nodes) { box.innerHTML = `<div class="tag">Manual page not found. Run <code>cd site && npm run build</code>, then reload.</div>`; return; }
  const r = sectionRange(nodes, sec);
  const clone = (a, b) => nodes.slice(a, b).filter((n) => !n.matches(".evidence")).map((n) => n.cloneNode(true));
  const main = Object.assign(document.createElement("div"), { className: "sl-markdown-content" });
  main.append(...clone(r.start, r.stop));
  const pre = Object.assign(document.createElement("div"), { className: "ctx sl-markdown-content" }); pre.append(...clone(r.before, r.start));
  const post = Object.assign(document.createElement("div"), { className: "ctx sl-markdown-content" }); post.append(...clone(r.stop, r.after));
  const label = (t) => Object.assign(document.createElement("p"), { className: "ctx-label", textContent: t });
  box.innerHTML = `<div class="tag"></div>`;
  if (pre.childNodes.length) box.append(label("Before this section"), pre, label("This section"));
  box.append(main);
  if (post.childNodes.length) box.append(label("After this section"), post);
  await drawDiagrams(box);
  if (token !== at) return;
  const found = highlight(main, item.target) || highlight(pre, item.target) || highlight(post, item.target);
  const note = item.kind === "related" ? (found ? "highlight: the statement this related point attaches to" : "a related point, not tied to one statement") : found ? "highlight: the statement under review" : "statement not located automatically; read it in the yellow box";
  box.querySelector(".tag").innerHTML = `Manual: ${esc(sec.chapter)} › ${esc(sec.section)} · ${note} · <a href="/${sec.page}.html#${sec.hash}" target="_blank" rel="noopener">page ↗</a>`;
  box.dataset.found = found ? "1" : "0";
  const m = box.querySelector("mark");
  const top = (el) => el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
  box.scrollTop = m ? top(m) - box.clientHeight / 2 : pre.childNodes.length ? top(main) - 40 : 0;
}

function renderRefs(sec, item) {
  const cited = item.cited.length ? item.cited.map((n) => sec.refs.find((r) => r.n === n)) : sec.refs;
  const rest = item.cited.length ? sec.refs.filter((r) => !item.cited.includes(r.n)) : [];
  const row = (r, i) => {
    const links = [
      ...r.local.map((l) => `<a data-open="${esc(l.href)}" data-t="Retrieved copy (${l.kind}): ${esc(r.key)}" data-n="${r.n}">Retrieved ${l.kind}</a>`),
      r.pmid ? `<a data-open="https://pubmed.ncbi.nlm.nih.gov/${esc(r.pmid)}/" data-embed="/api/abstract?pmid=${esc(r.pmid)}" data-t="PubMed abstract: ${esc(r.key)}" data-n="${r.n}">PubMed abstract</a>` : "",
      r.doi ? `<a data-open="https://doi.org/${esc(r.doi)}" data-t="DOI: ${esc(r.key)}" data-n="${r.n}">DOI</a>` : "",
      r.url ? `<a data-open="${esc(r.url)}" data-t="Link: ${esc(r.key)}" data-n="${r.n}">Link</a>` : "",
    ].filter(Boolean).join("");
    return `<div class="ref" data-ref="${r.n}"><span class="n">${i === undefined ? "" : i + 1}</span><span class="t">${esc(r.text)}</span><span class="acts">${links}</span></div>`;
  };
  $("refs").innerHTML = `<h3>Cited in this item (${cited.length})</h3>${cited.map((r, i) => row(r, i)).join("")}` + (rest.length ? `<details><summary>Other references in this box (${rest.length})</summary>${rest.map((r) => row(r)).join("")}</details>` : "");
}

async function openRef(url, title, n, embed) {
  document.querySelectorAll(".ref.on").forEach((e) => e.classList.remove("on"));
  document.querySelectorAll(`.ref[data-ref="${n}"]`).forEach((e) => e.classList.add("on"));
  document.querySelectorAll("#item sup a").forEach((a) => a.classList.toggle("opened", a.dataset.ref === String(n)));
  const vbody = $("vbody"), vopen = $("vopen");
  $("vtitle").textContent = title; vopen.href = url; vopen.hidden = false;
  if (!embed && !url.startsWith("/")) {
    vbody.innerHTML = `<div class="vmsg">Checking whether this site can be embedded…</div>`;
    if (!framed.has(url)) framed.set(url, await fetch("/api/frame?url=" + encodeURIComponent(url)).then((r) => r.json()).catch(() => ({ ok: false, reason: "the check failed" })));
    if ($("vopen").getAttribute("href") !== url) return;
    const f = framed.get(url);
    if (!f.ok) { vbody.innerHTML = `<div class="vmsg">Can't show this here: ${esc(f.reason)}.<br><br><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab ↗</a></div>`; return; }
  }
  vbody.innerHTML = "";
  vbody.style.height = "100%";
  vbody.append(Object.assign(document.createElement("iframe"), { src: embed || url, title }));
}
function openBest(sec, n) {
  const r = sec.refs.find((x) => x.n === n); if (!r) return;
  document.querySelector(`.ref[data-ref="${n}"]`)?.closest("details")?.setAttribute("open", "");
  if (r.local[0]) return openRef(r.local[0].href, `Retrieved copy (${r.local[0].kind}): ${r.key}`, n);
  if (r.pmid) return openRef(`https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/`, `PubMed abstract: ${r.key}`, n, `/api/abstract?pmid=${r.pmid}`);
  const u = r.doi ? `https://doi.org/${r.doi}` : r.url; if (u) openRef(u, `Link: ${r.key}`, n);
}

function renderProgress() {
  const done = data.items.filter((i) => scores[i.id]?.score != null).length;
  $("count").textContent = `${done} / ${data.items.length} scored`;
  $("bar").style.width = (100 * done) / data.items.length + "%";
  const sec = sections.get(data.items[at].sectionId);
  const opts = [...$("jump").options];
  for (const o of opts) {
    const its = data.items.filter((i) => i.sectionId === o.value);
    o.textContent = `${o.dataset.name} (${its.filter((i) => scores[i.id]?.score != null).length}/${its.length})`;
  }
  $("jump").value = sec.id;
  const own = data.items.filter((i) => i.sectionId === sec.id);
  $("dots").innerHTML = own.map((i, k) => `<button data-go="${data.items.indexOf(i)}" class="${scores[i.id]?.score != null ? "done" : ""} ${i === data.items[at] ? "on" : ""}" title="${esc(i.label)}">${k + 1}</button>`).join("");
}

function renderScore(item) {
  const s = scores[item.id];
  document.querySelectorAll("#likert button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === s?.score));
  $("comment").value = s?.comment || "";
  $("question").innerHTML = `<b>Rate your agreement:</b> ${esc(question(item))}`;
  typed = false;
  $("saved").textContent = s ? `Saved ${new Date(s.timestamp).toLocaleString()}` : "Not scored yet";
}

function go(i) {
  flushComment();
  at = Math.max(0, Math.min(data.items.length - 1, i));
  const item = data.items[at], sec = sections.get(item.sectionId);
  store.set("evscore.at." + reviewer, item.id);
  $("crumb").textContent = `${sec.chapter} › ${sec.section} · item ${data.items.filter((x) => x.sectionId === sec.id).indexOf(item) + 1} of ${data.items.filter((x) => x.sectionId === sec.id).length} · ${at + 1} of ${data.items.length} overall`;
  const stale = scores[item.id] && scores[item.id].item_hash !== item.hash;
  $("item").innerHTML = `<section class="evidence not-content" aria-label="Evidence check">
    <div class="ev-head"><span class="ev-badge">Evidence check</span></div>
    <p class="ev-meta">AI-generated · independently AI-reviewed · checked ${esc(sec.checked)}${item.inBox ? "" : " · on the site, this statement is listed under Details"}</p>
    <ul class="ev-lines"><li class="ev-line ev-${item.tone}"><span class="ev-chip ev-${item.tone}">${esc(item.label)}</span> <span class="ev-what">${item.lineHtml}</span></li></ul>
    <p class="ev-full">${item.noteHtml}</p></section>` + (stale ? `<p class="stale">This item's text changed after you scored it. Please re-read and re-score.</p>` : "");
  renderRefs(sec, item);
  renderScore(item);
  renderProgress();
  $("vbody").innerHTML = `<div class="vmsg">Click a citation number, or a link above, to read the source here.</div>`;
  $("vtitle").textContent = "Pick a reference above"; $("vopen").hidden = true;
  renderManual(sec, item, at);
}

async function save(score) {
  const item = data.items[at];
  const res = await fetch("/api/score", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reviewer, item_id: item.id, score, comment: $("comment").value }) });
  if (!res.ok) { $("saved").textContent = "NOT saved: is the app still running?"; return; }
  scores[item.id] = await res.json();
  typed = false;
  if (data.items[at] === item) { renderScore(item); renderProgress(); }
}
function flushComment() {
  clearTimeout(commentTimer);
  if (!data || !typed) return;
  const item = data.items[at];
  if (($("comment").value.trim()) !== (scores[item.id]?.comment || "")) save(scores[item.id]?.score ?? null);
  typed = false;
}
const pick = (v) => { const cur = scores[data.items[at].id]?.score; save(cur === v ? null : v); };
const nextOpen = () => {
  const n = data.items.length;
  for (let k = 1; k <= n; k++) { const i = (at + k) % n; if (scores[data.items[i].id]?.score == null) return go(i); }
  $("saved").textContent = "All items are scored.";
};

async function start(name) {
  reviewer = name.trim();
  store.set("evscore.reviewer", reviewer);
  [data, scores] = await Promise.all([fetch("/api/items.json").then((r) => r.json()), fetch("/api/scores?reviewer=" + encodeURIComponent(reviewer)).then((r) => r.json())]);
  sections = new Map(data.sections.map((s) => [s.id, s]));
  $("gate").hidden = true; $("gate").style.display = "none"; $("app").hidden = false;
  $("who").textContent = reviewer;
  $("export").href = "/api/export.csv?reviewer=" + encodeURIComponent(reviewer);
  $("likert").innerHTML = Object.entries(data.scale).map(([v, t]) => `<button data-v="${v}"><kbd>${v}</kbd>${esc(t)}</button>`).join("");
  $("jump").innerHTML = [...new Set(data.sections.map((s) => s.chapter))].map((c) => `<optgroup label="${esc(c)}">${data.sections.filter((s) => s.chapter === c).map((s) => `<option value="${s.id}" data-name="${esc(s.section)}">${esc(s.section)}</option>`).join("")}</optgroup>`).join("");
  // resume: where this reviewer stopped, else the first item without a score
  const last = data.items.findIndex((i) => i.id === store.get("evscore.at." + reviewer));
  const open = data.items.findIndex((i) => scores[i.id]?.score == null);
  go(last >= 0 ? last : open >= 0 ? open : 0);
}

document.querySelector("#gate form").addEventListener("submit", (e) => { e.preventDefault(); start($("name").value); });
$("name").value = store.get("evscore.reviewer") || "";
$("switch").onclick = (e) => { e.preventDefault(); flushComment(); location.reload(); };
$("prev").onclick = () => go(at - 1);
$("next").onclick = () => go(at + 1);
$("nextOpen").onclick = nextOpen;
$("jump").onchange = () => go(data.items.findIndex((i) => i.sectionId === $("jump").value));
$("likert").onclick = (e) => { const b = e.target.closest("button"); if (b) pick(Number(b.dataset.v)); };
$("dots").onclick = (e) => { const b = e.target.closest("button"); if (b) go(Number(b.dataset.go)); };
$("comment").oninput = () => { typed = true; clearTimeout(commentTimer); commentTimer = setTimeout(flushComment, 1500); };
$("comment").onblur = flushComment;
$("refs").onclick = (e) => { const a = e.target.closest("[data-open]"); if (a) openRef(a.dataset.open, a.dataset.t, a.dataset.n, a.dataset.embed); };
$("item").onclick = (e) => { const a = e.target.closest("a[data-ref]"); if (a) { e.preventDefault(); openBest(sections.get(data.items[at].sectionId), Number(a.dataset.ref)); } };
addEventListener("keydown", (e) => {
  if (!data || /TEXTAREA|INPUT|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= "1" && e.key <= "5") pick(Number(e.key));
  else if (e.key === "ArrowRight") go(at + 1);
  else if (e.key === "ArrowLeft") go(at - 1);
});
addEventListener("pagehide", flushComment);
</script>
</body>
</html>
