<!-- Installable app (PWA): offline service worker and the "offline copy" banner -->
<div id="nicu-offline" hidden></div>
<style>
#nicu-offline { position: fixed; top: 0; left: 0; right: 0; z-index: 1100; padding: 6px 12px; text-align: center;
  background: #fdf0d2; color: #7a4b00; font-size: 14px; border-bottom: 1px solid #f0c36d; }
#nicu-offline[hidden] { display: none; }
@media print { #nicu-offline { display: none; } }
</style>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").catch(function () {});
  var banner = document.getElementById("nicu-offline");
  // the service worker knows when the offline copy was published
  function builtDate() {
    return new Promise(function (resolve) {
      var sw = navigator.serviceWorker.controller;
      if (!sw) return resolve("");
      var ch = new MessageChannel();
      ch.port1.onmessage = function (e) { resolve(e.data && e.data.built || ""); };
      sw.postMessage({ type: "built" }, [ch.port2]);
      setTimeout(function () { resolve(""); }, 1500);
    });
  }
  function update() {
    if (navigator.onLine) { banner.hidden = true; return; }
    builtDate().then(function (built) {
      banner.textContent = "Offline copy" + (built ? " — last updated " + built : "") +
        ". Check the live manual when you're back online. The chat needs internet.";
      banner.hidden = false;
    });
  }
  window.addEventListener("online", update);
  window.addEventListener("offline", update);
  update();
})();
</script>
