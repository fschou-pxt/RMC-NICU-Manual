project:
  type: book
  resources:
    - chatbot/nicu-manual-knowledge.md
    - manifest.webmanifest
    - pwa/*.png

book:
  sidebar: 
    title: NICU Manual
    search: true
    background: light
  title: KP Riverside Neonatal ICU Manual
  subtitle: <em style="font-size;14px;">Fu-Sheng Chou, MD PhD</em>
  author: 
    - <em>(alphabetical)</em>
    - Michael Chang, MD
    - Anupama Chundu, MD
    - Fu-Sheng Chou, MD PhD
    - Michael Doti, MD
    - Giulia M. Faison, MD MA
    - Beverly Giang, MD
    - Kasee L. Houston, MD
    - James A. Washington III, MD
  date: last-modified
  date-format: "[Last Updated on] MMMM DD, YYYY"
  chapters:
    - index.qmd
    - part: "NICU Operations"
      chapters: 
        - telemedicine.qmd
        - phone-numbers.qmd
        - operations.qmd
        - publications.qmd
    - part: "General Care"
      chapters:
        - admission.qmd
        - transfer.qmd
        - discharge.qmd
        - documentation.qmd
        - death-workflows.qmd
    - part: "System-Based Protocols"
      chapters: 
        - respiratory.qmd
        - cardiovascular.qmd
        - nutrition-fluid.qmd
        - gastrointestinal.qmd
        - renal-urology.qmd
        - infectious-disease.qmd
        - endocrine.qmd
        - neurology.qmd
        - hemonc.qmd
        - genetics-lluch.qmd
    - part: "Special Considersations"
      chapters: 
        - periviability.qmd
        - VLBW.qmd
        - DR.qmd
        - surgical.qmd
    - part: "Health Maintenance"
      chapters:
        - vaccine.qmd
  appendices: 
    - lluch-formulary.qmd
    - dotPhrases.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: lumen
    css: custom.css
    include-in-header: pwa/head.html
    include-before-body:
      # soft launch of the new site (nicu-manual.pages.dev): a banner linking to the same page there
      - pwa/new-site.html
    include-after-body:
      # chat assistant hidden on the live site until the January 2027 launch (pre-launch survey); it lives on the revamp branch
      - pwa/register.html
    page-break-after: always


editor: source
