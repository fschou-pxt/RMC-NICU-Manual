// ---------- answers from outside the manual (only when the user asks for them) ----------
const EXTERNAL_SYSTEM = `You are assisting a NICU clinician at KP Riverside. The unit's NICU manual does not cover this question, so the clinician asked for an answer from outside the manual.
- Answer concisely: at most 120 words. Start with "**Bottom line:** " and one sentence, then up to 4 short bullets.
- Say where evidence is limited or practice varies, and recommend confirming with the attending neonatologist, pharmacy, or KP policy before acting.
- Never invent references or numbers. Do not repeat patient identifiers.
- Use markdown bullets and **bold** only; do not put URLs or citation markers in the text.`;
const WEB_EXTRA = `\n- Base the answer on the web search results, preferring professional guidelines (AAP, NRP, CDC, ACOG) and peer-reviewed sources.`;
const WEB_TOOL_2026 = ["claude-opus-5-5", "claude-sonnet-5-5"]; // others use the basic web search tool

async function askExternal(provider, key, model, messages, web) {
  const system = EXTERNAL_SYSTEM + (web ? WEB_EXTRA : "");
  if (provider === "anthropic") {
    sdk ??= await import(SDK_URL);
    const client = new sdk.default({ apiKey: key, dangerouslyAllowBrowser: true });
    const params = { model, max_tokens: 4000, system, messages, output_config: { effort: "low" } };
    if (web) params.tools = [{ type: WEB_TOOL_2026.includes(model) ? "web_search_20260209" : "web_search_20250305",
      name: "web_search", max_uses: 3 }];
    let resp, convo = messages;
    for (let i = 0; i < 3; i++) { // web search may pause a long turn; continue it
      resp = await client.messages.create({ ...params, messages: convo });
      if (resp.stop_reason !== "pause_turn") break;
      convo = [...messages, { role: "assistant", content: resp.content }];
    }
    if (resp.stop_reason === "refusal") throw new Error("The model declined to answer this question.");
    const texts = resp.content.filter((b) => b.type === "text");
    const links = texts.flatMap((b) => (b.citations || []).filter((c) => c.url).map((c) => ({ title: c.title || c.url, url: c.url })));
    return { text: texts.map((b) => b.text).join(""), links };
  }
  if (!web) {
    const r = await fetch(CHAT_URLS[provider], { method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({ model, messages: [{ role: "system", content: system }, ...messages] }) });
    if (!r.ok) throw await httpError(provider, r);
    return { text: (await r.json()).choices?.[0]?.message?.content || "", links: [] };
  }
  // OpenAI and xAI both offer web search through the Responses API
  const url = provider === "openai" ? "https://api.openai.com/v1/responses" : "https://api.x.ai/v1/responses";
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
    body: JSON.stringify({ model, instructions: system, input: messages, tools: [{ type: "web_search" }] }) });
  if (!r.ok) throw await httpError(provider, r);
  const data = await r.json();
  const parts = (data.output || []).filter((o) => o.type === "message").flatMap((o) => o.content || [])
    .filter((c) => c.type === "output_text");
  const links = parts.flatMap((c) => (c.annotations || []).filter((a) => a.url).map((a) => ({ title: a.title || a.url, url: a.url })));
  for (const u of data.citations || []) if (typeof u === "string") links.push({ title: u, url: u }); // xAI
  return { text: parts.map((c) => c.text).join("") || data.output_text || "", links };
}
async function httpError(provider, r) {
  const detail = await r.text();
  const err = new Error(`${PROVIDERS[provider].name} error ${r.status}: ${detail.slice(0, 200)}`);
  err.status = r.status;
  try { err.error = { error: JSON.parse(detail).error }; } catch {}
  return err;
}
function friendlyError(e, provider) {
  const status = e?.status;
  if (status === 401 || (status === 400 && /api key/i.test(e.message))) return "Your API key was rejected. Check it in settings (⚙).";
  // OpenAI omits CORS headers on error replies, so a bad key surfaces as a network failure
  if (provider === "openai" && e instanceof TypeError)
    return "Couldn't get a reply from OpenAI. Check your OpenAI key in settings (⚙) and your connection.";
  if (status === 403) return "This API key doesn't have access to that model.";
  if (status === 429) {
    // show the provider's own reason: no credit and per-minute limits both come back as 429
    const detail = e?.error?.error?.message || e?.error?.message || "";
    if (/quota|credit|billing|balance/i.test(detail + e.message))
      return "Your API account has no available credit. Add billing/credit in the provider's console. (" + detail.slice(0, 160) + ")";
    return "The provider's per-minute limit for your API account was reached" +
      (detail ? ": " + detail.slice(0, 200) : ".") + " New accounts start with low limits that rise with usage.";
  }
  if (status >= 500) return "The AI service is busy or unavailable. Try again shortly.";
  if (status === 400) return "The request was rejected: " + (e?.error?.error?.message || e.message);
  if (sdk && e instanceof sdk.default.APIConnectionError || e instanceof TypeError)
    return "Couldn't reach the AI service. Check your connection.";
  return e?.message || String(e);
}

// ---------- highlighting on the page ----------
function clearHighlights() {
  document.querySelectorAll("mark.nicu-hl").forEach((m) => m.replaceWith(...m.childNodes));
}
function highlightOnPage(quote, hash) {
  clearHighlights();
  const main = document.querySelector("#quarto-document-content") || document.body;
  if (quote) {
    const nodes = [], map = [];
    let flat = "";
    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, { acceptNode: (n) =>
      n.parentElement.closest("script,style,#nicu-chat-root,.anchorjs-link") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      const ni = nodes.push(n) - 1;
      for (let i = 0; i < n.data.length; i++) {
        const c = squashChar(n.data[i]);
        if (c) { flat += c; map.push([ni, i]); }
      }
    }
    let needle = squash(quote), at = flat.indexOf(needle);
    if (at < 0 && needle.length > 30) { needle = needle.slice(0, 30); at = flat.indexOf(needle); }
    if (at >= 0) {
      const [sn, so] = map[at], [en, eo] = map[at + needle.length - 1];
      const marks = [];
      for (let ni = en; ni >= sn; ni--) {
        let node = nodes[ni];
        const s = ni === sn ? so : 0, e = ni === en ? eo + 1 : node.data.length;
        if (e <= s || !node.data.slice(s, e).trim()) continue;
        if (s > 0) node = node.splitText(s);
        if (e - s < node.data.length) node.splitText(e - s);
        const mark = document.createElement("mark");
        mark.className = "nicu-hl";
        node.replaceWith(mark);
        mark.appendChild(node);
        marks.unshift(mark);
      }
      if (marks.length) { marks[0].scrollIntoView({ behavior: "smooth", block: "center" }); return true; }
    }
  }
  const target = hash && document.getElementById(decodeURIComponent(hash.slice(1)));
  if (target) {
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    target.classList.remove("nicu-flash"); void target.offsetWidth; target.classList.add("nicu-flash");
  }
  return false;
}
function jumpTo(src) {
  const target = new URL(localize(src.url), location.href);
  if (window.innerWidth < 600) setOpen(false); // the panel covers the page on phones
  else if (ui.max) { maxPaused = true; applyUi(); } // shrink so the highlighted text is visible
  if (target.pathname === location.pathname) {
    if (target.hash && location.hash !== target.hash) window.history.replaceState(null, "", target.hash);
    highlightOnPage(src.quote, target.hash);
  } else {
    store.set(S, K.pending, JSON.stringify({ quote: src.quote, hash: target.hash, unmax: maxPaused }));
    location.href = target.href;
  }
}

// ---------- tiny markdown renderer (escaped first) ----------
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderMd(md) {
  const out = [];
  let list = null;
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    const ul = line.match(/^\s*[-*•]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const kind = ul ? "ul" : ol ? "ol" : null;
    if (kind) {
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      const item = (ul || ol)[1], mark = { "✓": "nc-met", "✗": "nc-unmet", "?": "nc-unknown" }[item[0]];
      out.push(mark ? `<li class="nc-crit ${mark}"><b>${item[0]}</b><span>${inline(item.slice(1).trim())}</span></li>`
        : `<li>${inline(item)}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line.trim())}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}

        messages: [{ role: "user", content: (prior ? `Earlier question: ${prior}\n` : "") + `Question: ${question}` }] });
      const again = retrieve(sections, expandQuery([rq.question, ...(rq.terms || []), question].join(" ")));
      if (again.some((s) => !excerpts.some((e) => e.id === s.id))) { // only re-ask if the search found something new
        rephrased = (rq.question || "").trim();
        excerpts = again;
        out = await answer(excerpts, rephrased);
      }
    }
    out ??= { answer: "The manual does not address this. Check with the attending neonatologist or pharmacy.",
      not_in_manual: true, sources: [] };
    const byId = new Map(excerpts.map((s) => [s.id, s]));
    const seen = new Set();
    const sources = (out.sources || []).filter((s) => byId.has(s.id) && !seen.has(s.id) && seen.add(s.id)).map((s) => {
      const sec = byId.get(s.id);
      const ok = s.quote && squash(sec.text).includes(squash(s.quote));
      return { title: sec.title, url: sec.url, quote: ok ? s.quote : "" };
    });
    reply = { role: "assistant", text: out.answer || "(no answer)", rephrased,
      sources: out.not_in_manual ? sources.slice(0, 1) : sources, offerExternal: !!out.not_in_manual };
  } catch (e) {
    reply = { role: "assistant", error: true, text: friendlyError(e, provider) };
  }
  busy = false;
  history.push(reply); saveHistory(); render();
  if (!reply.error && reply.sources?.length && settings().autoJump) jumpTo(reply.sources[0]);
});

// restore state after navigating between chapters
const pending = readJSON(S, K.pending, null);
if (pending?.unmax) maxPaused = true;
applyUi();
if (store.get(S, K.open) === "1") setOpen(true);
if (pending) {
  store.del(S, K.pending);
  const go = () => setTimeout(() => highlightOnPage(pending.quote, pending.hash || location.hash), 300);
  document.readyState === "complete" ? go() : window.addEventListener("load", go);
}
window.NICUChat = { loadSections, retrieve, expandQuery, highlightOnPage, jumpTo, squash }; // for debugging in the console
</script>
