<!-- NICU Manual chat: answers from the manual, opens and highlights the source.
     Runs entirely in the browser with the user's own API key (Anthropic, OpenAI, or xAI). -->
<div id="nicu-chat-root"></div>
<style>
#nicu-chat-root { --nc-blue: #003b71; --nc-blue-dark: #002a52; --nc-bg: #ffffff; --nc-soft: #f3f7fa;
  --nc-text: #222; --nc-muted: #6b7280; --nc-border: #d9e1e7; font-size: 14px; line-height: 1.45; }
#nicu-chat-root * { box-sizing: border-box; }
.nc-launch { position: fixed; right: 20px; bottom: 20px; z-index: 1050; width: 56px; height: 56px;
  border-radius: 50%; border: 0; background: var(--nc-blue); color: #fff; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
.nc-launch:hover { background: var(--nc-blue-dark); }
.nc-panel { position: fixed; right: 20px; bottom: 88px; z-index: 1050; width: var(--nc-w, 420px); max-width: calc(100vw - 32px);
  height: 600px; max-height: calc(100vh - 110px); background: var(--nc-bg); color: var(--nc-text);
  border: 1px solid var(--nc-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  display: flex; flex-direction: column; overflow: hidden; font-size: var(--nc-fs, 16px); }
.nc-panel[hidden] { display: none; }
/* near-full-window mode: content stays in a readable centered column */
.nc-panel.nc-max { top: 16px; left: 16px; right: 16px; bottom: 16px; width: auto; height: auto; max-width: none; max-height: none; }
.nc-max .nc-body, .nc-max .nc-foot { padding-left: max(16px, calc((100% - 860px) / 2)); padding-right: max(16px, calc((100% - 860px) / 2)); }
#nicu-chat-root.nc-maxed .nc-launch { display: none; }
.nc-head { display: flex; align-items: center; gap: 2px; padding: 10px 8px 10px 14px; background: var(--nc-blue); color: #fff; font-size: 14px; }
.nc-head strong { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-icon { background: transparent; border: 0; color: #fff; cursor: pointer; padding: 0 7px; border-radius: 6px; font-size: 13px; font-weight: 600;
  min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.nc-icon .bi { font-size: 14px; }
.nc-icon:hover { background: rgba(255,255,255,.18); }
.nc-icon:disabled { opacity: .4; cursor: default; background: transparent; }
.nc-body { flex: 1; overflow-y: auto; padding: 12px; background: var(--nc-soft); }
.nc-msg { margin: 0 0 10px; padding: 8px 11px; border-radius: 10px; max-width: 92%; word-wrap: break-word; }
.nc-user { margin-left: auto; background: var(--nc-blue); color: #fff; white-space: pre-wrap; }
.nc-bot { background: #fff; border: 1px solid var(--nc-border); }
.nc-bot p { margin: 0 0 6px; } .nc-bot p:last-child { margin-bottom: 0; }
.nc-bot ul, .nc-bot ol { margin: 4px 0 6px; padding-left: 20px; }
.nc-src { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--nc-border); font-size: .9em; }
.nc-src b { color: var(--nc-muted); font-weight: 600; }
.nc-bot li.nc-crit { list-style: none; display: flex; gap: .4em; margin-left: -20px; }
.nc-crit > b { flex: 0 0 1.1em; text-align: center; }
.nc-crit > span { flex: 1; min-width: 0; }
.nc-met > b { color: #1e7b34; } .nc-unmet > b { color: #b42318; } .nc-unknown > b { color: #b26b00; }
.nc-sg { margin-top: 5px; }
.nc-sg > span { display: block; color: var(--nc-text); font-weight: 600; margin-bottom: 3px; }
.nc-chip { display: inline-block; margin: 0 5px 5px 0; padding: 2px 9px; border: 1px solid var(--nc-blue);
  border-radius: 999px; background: #fff; color: var(--nc-blue-dark); cursor: pointer; font-size: inherit; line-height: 1.5; }
.nc-chip:hover { background: var(--nc-blue); color: #fff; }
.nc-note { font-size: .85em; color: var(--nc-muted); margin: 0 0 10px; }
.nc-err { background: #fdecea; border: 1px solid #f5c2bd; color: #8a1c12; }
.nc-offer { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--nc-border); }
.nc-offer p { font-size: .85em; color: var(--nc-muted); margin: 0 0 6px; }
.nc-offer .nc-btn { margin: 0 6px 6px 0; font-size: .9em; }
.nc-ext { border: 1px solid #f0c36d; background: #fffaf0; }
.nc-ext-banner { margin: -8px -11px 8px; padding: 5px 11px; background: #fdf0d2; color: #7a4b00;
  font-weight: 600; font-size: .85em; border-radius: 10px 10px 0 0; }
.nc-neo { margin-top: 8px; border: 1px solid #f0c36d; background: #fffaf0; border-radius: 10px; padding: 8px 11px; }
.nc-neo .nc-src { border-top-color: #f0c36d; }
.nc-art { display: block; margin: 5px 0 0; font-weight: 500; line-height: 1.35; }
.nc-art small { color: var(--nc-muted); font-weight: 400; }
.nc-phi { border: 1px solid #e8b4b0; border-radius: 10px; padding: 7px 10px; margin: 0 0 10px; font-size: .85em; }
.nc-phi summary { cursor: pointer; } .nc-phi summary b { color: #b3261e; }
.nc-phi ul { margin: 5px 0 6px; padding-left: 18px; } .nc-phi p { margin: 6px 0 0; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-phi summary b { color: #f5a5a0; }
.nc-typing { color: var(--nc-muted); font-style: italic; }
.nc-foot { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--nc-border); background: #fff; }
.nc-foot[hidden] { display: none; }
.nc-foot textarea { flex: 1; resize: none; height: 3.6em; border: 1px solid var(--nc-border); border-radius: 8px;
  padding: 6px 8px; font: inherit; }
.nc-send { border: 0; border-radius: 8px; background: var(--nc-blue); color: #fff; padding: 0 14px; cursor: pointer; }
.nc-send:disabled { opacity: .5; cursor: default; }
.nc-set label { display: block; font-weight: 600; margin: 10px 0 4px; }
.nc-set label:not(.nc-check) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-set input[type=password], .nc-set input[type=text], .nc-set select { width: 100%; height: 2.4em; padding: 0 8px;
  border: 1px solid var(--nc-border); border-radius: 6px; font: inherit; }
.nc-set .nc-check { font-weight: 400; display: flex; gap: 6px; align-items: flex-start; }
.nc-set .nc-row { display: flex; gap: 8px; margin-top: 14px; }
.nc-btn { border: 1px solid var(--nc-blue); background: var(--nc-blue); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.nc-btn.nc-ghost { background: #fff; color: var(--nc-blue-dark); }
mark.nicu-hl { background: #ffe066; color: inherit; padding: 0 1px; border-radius: 2px; scroll-margin-top: 120px; }
.nicu-flash { animation: nicuFlash 2.5s ease-out; }
@keyframes nicuFlash { from { background: #ffe066; } to { background: transparent; } }
@media (max-width: 600px) {
  .nc-panel { right: 8px; left: 8px; width: auto; max-width: none; bottom: 80px; height: calc(100vh - 100px); }
  .nc-launch { right: 14px; bottom: 14px; }
}
/* dark theme (Quarto's toggle adds body.quarto-dark) */
:is(body.quarto-dark, html[data-theme="dark"] body) #nicu-chat-root { --nc-blue: #2f6ea8; --nc-blue-dark: #7cc0f5; --nc-bg: #162131; --nc-soft: #0f1722;
  --nc-text: #dde5ee; --nc-muted: #9fb0c3; --nc-border: #263445; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-bot, :is(body.quarto-dark, html[data-theme="dark"] body) .nc-foot, :is(body.quarto-dark, html[data-theme="dark"] body) .nc-chip, :is(body.quarto-dark, html[data-theme="dark"] body) .nc-btn.nc-ghost { background: #162131; color: var(--nc-text); }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-foot textarea, :is(body.quarto-dark, html[data-theme="dark"] body) .nc-set input, :is(body.quarto-dark, html[data-theme="dark"] body) .nc-set select { background: #0f1722; color: var(--nc-text); }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-ext { background: #2a2416; border-color: #6b5420; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-ext-banner { background: #3a3018; color: #f3d48a; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-neo { background: #2a2416; border-color: #6b5420; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-err { background: #3a1d1d; border-color: #6b2c2c; color: #f5b5b0; }
/* phones (and the installed app on a phone): a bottom tab bar to the site's main pages instead of the chat bubble */
.nc-tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1040; display: none; background: #fff;
  border-top: 1px solid #d9e1e7; padding-bottom: env(safe-area-inset-bottom); }
.nc-tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 8px;
  font-size: 11px; color: #6b7280; text-decoration: none; }
.nc-tabbar a i { font-size: 20px; line-height: 1; }
.nc-tabbar a.on { color: #003b71; font-weight: 600; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-tabbar { background: #121c29; border-top-color: #263445; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-tabbar a { color: #9fb0c3; }
:is(body.quarto-dark, html[data-theme="dark"] body) .nc-tabbar a.on { color: #7cc0f5; }
@media (max-width: 50rem) {
  .nc-has-tabbar .nc-tabbar { display: flex; }
  .nc-has-tabbar #nicu-chat-root .nc-launch { display: none; }
  body.nc-has-tabbar { padding-bottom: calc(60px + env(safe-area-inset-bottom)); --nc-tabbar-h: calc(60px + env(safe-area-inset-bottom)); }
  .nc-has-tabbar .sidebar-pane { bottom: var(--nc-tabbar-h); } /* Starlight's phone menu ends above the tab bar */
}
/* the Ask page is the chat itself */
body:has(.ask-app) #nicu-chat-root { display: none; }
@media print { #nicu-chat-root, .nc-tabbar { display: none; } }
</style>
<script type="module">
// Page widget: the chat bubble on every manual page. The engine (search, prompts, model calls,
// rendering) is shared with the app in chatbot/engine.js.
import { K, S, L, LIVE_BASE, ROOT, store, readJSON, localize, settings, hasKey, loadHistory, saveHistory,
  answerQuestion, answerOutside, renderMessage, renderSettings, highlightIn, clearHighlights,
  loadSections, retrieve, expandQuery, squash, esc, currentModel, shortLabel, phiNoticeHTML, phiConfirm } from "./chatbot/engine.js";

// ---------- highlighting on the page ----------
function highlightOnPage(quote, hash) {
  clearHighlights();
  const content = document.querySelector("#quarto-document-content, .sl-markdown-content") || document.body;
  const marks = highlightIn(content, quote);
  if (marks.length) { marks[0].scrollIntoView({ behavior: "smooth", block: "center" }); return true; }
  const target = hash && document.getElementById(decodeURIComponent(hash.slice(1)));
  if (target) {
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    target.classList.remove("nicu-flash"); void target.offsetWidth; target.classList.add("nicu-flash");
  }
  return false;
}
function jumpTo(src) {
  const target = new URL(localize(src.url), location.href);
  if (window.innerWidth < 600) setOpen(false); // the panel covers the page on phones
  else if (ui.max) { maxPaused = true; applyUi(); } // shrink so the highlighted text is visible
  const samePage = (a, b) => a.replace(/\.html$/, "").replace(/\/index$/, "/") === b.replace(/\.html$/, "").replace(/\/index$/, "/");
  if (samePage(target.pathname, location.pathname)) {
    if (target.hash && location.hash !== target.hash) window.history.replaceState(null, "", target.hash);
    highlightOnPage(src.quote, target.hash);
  } else {
    store.set(S, K.pending, JSON.stringify({ quote: src.quote, hash: target.hash, unmax: maxPaused }));
    location.href = target.href;
  }
}

// ---------- UI ----------
const root = document.getElementById("nicu-chat-root");
document.body.append(root); // a direct child of <body>: page layouts with their own layers can't cover the bubble
root.innerHTML = `
  <button class="nc-launch" type="button" aria-label="Ask the NICU Manual" title="Ask the NICU Manual">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <section class="nc-panel" role="dialog" aria-label="Ask the NICU Manual" hidden>
    <div class="nc-head">
      <strong>Ask the NICU Manual</strong>
      <button class="nc-icon" data-act="smaller" type="button" title="Smaller text" aria-label="Smaller text">A−</button>
      <button class="nc-icon" data-act="bigger" type="button" title="Larger text" aria-label="Larger text">A+</button>
      <button class="nc-icon" data-act="max" type="button"></button>
      <button class="nc-icon" data-act="new" type="button" title="New chat" aria-label="New chat">New</button>
      <button class="nc-icon" data-act="settings" type="button" title="Settings" aria-label="Settings"><i class="bi bi-gear" aria-hidden="true"></i></button>
      <button class="nc-icon" data-act="close" type="button" title="Close" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
    <div class="nc-body"></div>
    <form class="nc-foot">
      <textarea placeholder="Ask a question about the manual…" aria-label="Your question" maxlength="1500"></textarea>
      <button class="nc-send" type="submit">Ask</button>
    </form>
  </section>`;
const $ = (sel) => root.querySelector(sel);
const panel = $(".nc-panel"), body = $(".nc-body"), form = $(".nc-foot"), input = $("textarea"), sendBtn = $(".nc-send");
let history = loadHistory();
let busy = false, view = "chat", typingText = "Looking it up…";
function setTyping(text) { typingText = text; if (!panel.hidden && view === "chat") render(); }

// text size (5 levels) and near-full-window mode, remembered per device
const FONT_PX = [13, 14.5, 16, 18, 21], PANEL_W = [360, 390, 420, 470, 520];
const ui = { font: 2, max: false, ...readJSON(L, K.ui, {}) };
ui.font = Math.min(FONT_PX.length - 1, Math.max(0, ui.font | 0));
let maxPaused = false; // un-maximized while showing a source on the page; the expand button brings it back
// On the new site the expand button opens the Ask page, which continues this same conversation;
// the older book (no Ask page) keeps the near-full-window panel.
const askPage = !!document.querySelector("site-search");
if (askPage) ui.max = false;
function applyUi() {
  const max = ui.max && !maxPaused;
  panel.style.setProperty("--nc-fs", FONT_PX[ui.font] + "px");
  panel.style.setProperty("--nc-w", PANEL_W[ui.font] + "px");
  panel.classList.toggle("nc-max", max);
  root.classList.toggle("nc-maxed", max && !panel.hidden);
  $('[data-act="smaller"]').disabled = ui.font === 0;
  $('[data-act="bigger"]').disabled = ui.font === FONT_PX.length - 1;
  const mb = $('[data-act="max"]');
  mb.innerHTML = `<i class="bi bi-arrows-angle-${max ? "contract" : "expand"}" aria-hidden="true"></i>`;
  mb.title = askPage ? "Open as a full page (same conversation)" : max ? "Restore panel size" : "Expand to full window";
  mb.setAttribute("aria-label", mb.title);
}
function saveUi() { store.set(L, K.ui, JSON.stringify({ font: ui.font, max: ui.max })); applyUi(); }

function setOpen(open) {
  panel.hidden = !open;
  store.set(S, K.open, open ? "1" : "0");
  applyUi();
  if (open) { render(); if (view === "chat") input.focus(); }
}
function render() {
  if (!hasKey() || view === "settings") {
    form.hidden = true;
    return renderSettings(body, { onSaved: () => { view = "chat"; render(); input.focus(); }, onBack: () => { view = "chat"; render(); } });
  }
  form.hidden = false;
  const notice = `<p class="nc-note">Using <b>${esc(shortLabel(currentModel()))}</b> (change in <i class="bi bi-gear" aria-label="settings"></i>). Answers come from this manual unless marked otherwise, and may be wrong; verify with the linked source.</p>${phiNoticeHTML()}`;
  body.innerHTML = notice + history.map((m, i) => renderMessage(m, i, busy)).join("") +
    (busy ? `<div class="nc-msg nc-bot nc-typing">${esc(typingText)}</div>` : "");
  body.scrollTop = body.scrollHeight;
  sendBtn.disabled = busy;
}

root.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.classList.contains("nc-launch")) return setOpen(panel.hidden);
  const act = t.dataset.act;
  if (act === "close") setOpen(false);
  else if (act === "smaller" || act === "bigger") {
    ui.font = Math.min(FONT_PX.length - 1, Math.max(0, ui.font + (act === "bigger" ? 1 : -1))); saveUi();
  } else if (act === "max" && askPage) {
    // remember where the question started, so the Ask page can link back
    const title = (document.querySelector("h1[data-chapter-title]")?.textContent || document.title.split(" | ")[0]).trim();
    store.set(S, "nicuChat.from", JSON.stringify({ title, url: location.pathname + location.hash }));
    store.set(S, K.open, "0");
    location.href = ROOT + "ask";
  } else if (act === "max") {
    if (maxPaused) maxPaused = false; else ui.max = !ui.max;
    saveUi(); body.scrollTop = body.scrollHeight;
  }
  else if (act === "new") { history = []; saveHistory(history); clearHighlights(); view = "chat"; render(); }
  else if (act === "settings") { view = view === "settings" ? "chat" : "settings"; render(); }
  else if (t.dataset.ext) {
    if (busy) return;
    const i = +t.dataset.msg;
    history[i].offerExternal = false;
    busy = true; typingText = "Asking the AI…"; saveHistory(history); render();
    const reply = await answerOutside(history, i);
    busy = false; history.push(reply); saveHistory(history); render();
  } else if (t.dataset.msg !== undefined) {
    const src = history[+t.dataset.msg]?.sources?.[+t.dataset.src];
    if (src) jumpTo(src);
  }
});
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); form.requestSubmit(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !panel.hidden) { setOpen(false); $(".nc-launch").focus(); }
});
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const question = input.value.trim();
  if (!question || busy) return;
  if (!hasKey()) { view = "settings"; return render(); }
  if (!phiConfirm(question)) return;
  const past = history.slice();
  history.push({ role: "user", text: question });
  input.value = ""; busy = true; typingText = "Looking it up…"; saveHistory(history); render();
  const reply = await answerQuestion(question, past, setTyping);
  busy = false;
  history.push(reply); saveHistory(history); render();
  if (!reply.error && reply.sources?.length && settings().autoJump) jumpTo(reply.sources[0]);
});

// The tab bar to the site's main pages (shown on phones; the bubble covers Ask on wider screens).
// Only on the Astro site (Starlight's search element is there); the Quarto book has no Ask or Calculators pages.
const here = (location.pathname.split("/").pop() || "").replace(/\.html$/, "");
const bar = document.querySelector("site-search") && document.createElement("nav");
if (bar) {
document.body.classList.add("nc-has-tabbar");
bar.className = "nc-tabbar";
bar.setAttribute("aria-label", "Main sections");
bar.innerHTML = [["ask", "chat-dots", "Ask"], ["", "book", "Manual"], ["dotPhrases", "clipboard", "Dot phrases"],
  ["phone-numbers", "telephone", "Phones"], ["calculators", "calculator", "Calculators"]]
  .map(([path, icon, label]) => {
    const on = path ? here === path : !["ask", "dotPhrases", "phone-numbers", "calculators"].includes(here);
    return `<a href="${ROOT + path}"${on ? ' class="on" aria-current="page"' : ""}><i class="bi bi-${icon}"></i><span>${label}</span></a>`;
  }).join("");
document.body.appendChild(bar);
}

// "Recently viewed" on the home page lists chapters read here
const chapterTitle = (document.querySelector("h1[data-chapter-title]")?.dataset.chapterTitle ||
  document.querySelector("h1.title")?.textContent || "").replace(/\s+/g, " ").trim();
const page = (location.pathname.split("/").pop() || "index").replace(/^(?!.*\.html$)(.+)$/, "$1.html"); // new site drops .html
if (chapterTitle && page !== "index.html") {
  const recent = readJSON(L, "nicuChat.recent", []).filter((x) => !x.url.endsWith("/" + page));
  recent.unshift({ title: chapterTitle, url: LIVE_BASE + page });
  store.set(L, "nicuChat.recent", JSON.stringify(recent.slice(0, 12)));
}

// restore state after navigating between chapters
const pending = readJSON(S, K.pending, null);
if (pending?.unmax) maxPaused = true;
applyUi();
if (store.get(S, K.open) === "1" && innerWidth > 800) setOpen(true);
if (pending) {
  store.del(S, K.pending);
  const go = () => setTimeout(() => highlightOnPage(pending.quote, pending.hash || location.hash), 300);
  document.readyState === "complete" ? go() : window.addEventListener("load", go);
}
window.NICUChat = { open: () => setOpen(true), // used by the home page "Ask the manual" button
  loadSections, retrieve, expandQuery, highlightOnPage, jumpTo, squash }; // the rest are for debugging in the console
</script>
